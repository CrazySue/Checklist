/* ---------- 字体族 ---------- */
:root{
  --md-sys-typescale-font:'HarmonyOS Sans SC','HarmonyOS Sans SC Regular','Material Symbols Rounded',system-ui,sans-serif;
  --md-sys-typescale-icon-font:'Material Symbols Rounded';
}

/* ---------- MD3 设计令牌：自定义种子色生成浅/深配色 ----------
   用户提供的4色：#10172F #283558 #525288 #A5A8BA
   以 #525288 为主色派生完整 MD3 色板（浅色/深色）
   通过 color-mix 手动定义关键色板，确保跨浏览器一致。
*/
:root{
  /* 主色 */
  --md-primary:#525288;
  --md-on-primary:#FFFFFF;
  --md-primary-container:#E1E0FF;
  --md-on-primary-container:#0D006B;
  --md-secondary:#5D5B77;
  --md-on-secondary:#FFFFFF;
  --md-secondary-container:#E3E0F9;
  --md-on-secondary-container:#1A183B;
  --md-tertiary:#9B4069;
  --md-on-tertiary:#FFFFFF;
  --md-tertiary-container:#FFD9E2;
  --md-on-tertiary-container:#3E001E;
  --md-error:#BA1A1A;
  --md-on-error:#FFFFFF;
  --md-error-container:#FFDAD6;
  --md-on-error-container:#410002;
  /* 背景与表面 */
  --md-background:#FCF8FF;
  --md-on-background:#1B1B21;
  --md-surface:#FCF8FF;
  --md-on-surface:#1B1B21;
  --md-surface-variant:#E4E1EC;
  --md-on-surface-variant:#47464F;
  --md-surface-dim:#DCD9E0;
  --md-surface-bright:#FCF8FF;
  --md-surface-container-lowest:#FFFFFF;
  --md-surface-container-low:#F6F2FA;
  --md-surface-container:#F1ECF4;
  --md-surface-container-high:#EBE6EF;
  --md-surface-container-highest:#E5E1E9;
  --md-outline:#787680;
  --md-outline-variant:#C8C5D0;
  --md-shadow:#000000;
  --md-scrim:#000000;
  --md-inverse-surface:#2F3036;
  --md-inverse-on-surface:#F2EFF7;
  --md-inverse-primary:#C0C1FF;
  /* 用户提供色直接暴露 */
  --brand-1:#10172F;
  --brand-2:#283558;
  --brand-3:#525288;
  --brand-4:#A5A8BA;
}
/* 深色主题：以 #283558 调性派生 */
[data-theme="dark"]{
  --md-primary:#C0C1FF;
  --md-on-primary:#232E78;
  --md-primary-container:#3A4090;
  --md-on-primary-container:#E1E0FF;
  --md-secondary:#C6C4DD;
  --md-on-secondary:#2E2D47;
  --md-secondary-container:#45455F;
  --md-on-secondary-container:#E3E0F9;
  --md-tertiary:#FFB1C8;
  --md-on-tertiary:#5F112F;
  --md-tertiary-container:#7E294A;
  --md-on-tertiary-container:#FFD9E2;
  --md-error:#FFB4AB;
  --md-on-error:#690005;
  --md-error-container:#93000A;
  --md-on-error-container:#FFDAD6;
  --md-background:#131318;
  --md-on-background:#E5E1E9;
  --md-surface:#131318;
  --md-on-surface:#E5E1E9;
  --md-surface-variant:#47464F;
  --md-on-surface-variant:#C8C5D0;
  --md-surface-dim:#131318;
  --md-surface-bright:#39393F;
  --md-surface-container-lowest:#0E0E13;
  --md-surface-container-low:#1B1B21;
  --md-surface-container:#1F1F25;
  --md-surface-container-high:#2A2A30;
  --md-surface-container-highest:#35353B;
  --md-outline:#928F9A;
  --md-outline-variant:#47464F;
  --md-inverse-surface:#E5E1E9;
  --md-inverse-on-surface:#2F3036;
  --md-inverse-primary:#525288;
}

/* ---------- 全局重置 ---------- */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{height:100vh;height:100dvh;overflow:hidden;}
body{
  font-family:var(--md-sys-typescale-font);
  background:var(--md-background);
  color:var(--md-on-background);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  user-select:none;
  transition:background-color .25s ease,color .25s ease;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
input{font-family:inherit;color:inherit;border:none;background:none;outline:none;}
.icon{font-family:var(--md-sys-typescale-icon-font);font-weight:normal;font-style:normal;display:inline-block;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.icon.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}

/* ---------- MD3 通用动效曲线 ---------- */
:root{
  --md-easing-standard:cubic-bezier(.2,0,0,1);
  --md-easing-standard-decelerate:cubic-bezier(0,0,0,1);
  --md-easing-standard-accelerate:cubic-bezier(.3,0,1,1);
  --md-easing-emphasized:cubic-bezier(.2,0,0,1);
  --md-easing-emphasized-decelerate:cubic-bezier(.05,.7,.1,1);
  --md-easing-emphasized-accelerate:cubic-bezier(.3,0,.8,.15);
  --md-dur-short:150ms;
  --md-dur-medium:250ms;
  --md-dur-long:400ms;
  --md-dur-xlong:600ms;
}

/* ---------- MD3 状态层（hover/focus/press） ---------- */
.state-layer{position:relative;overflow:hidden;}
.state-layer::before{
  content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transition:opacity var(--md-dur-short) var(--md-easing-standard);
  pointer-events:none;border-radius:inherit;
}
.state-layer:hover::before{opacity:.08;}
.state-layer:focus-visible::before{opacity:.12;}
.state-layer:active::before{opacity:.12;}

/* ---------- MD3 水滴效果（Ripple） ---------- */
.md-ripple{
  position:absolute;border-radius:50%;
  background:currentColor;opacity:.14;
  transform:scale(0);
  animation:md-ripple-anim 500ms var(--md-easing-standard);
  pointer-events:none;z-index:0;
}
@keyframes md-ripple-anim{
  to{transform:scale(2.4);opacity:0;}
}
/* 较大卡片的水波速率更慢，更优雅 */
.check-item .md-ripple{animation-duration:650ms;}
.ci-check .md-ripple{animation-duration:600ms;}

/* ---------- 应用骨架 ---------- */
/* 用 100vh 回退 + 100dvh 优先（dvh 在手机端动态适应地址栏，避免底栏被遮挡） */
#app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  max-width:560px;margin:0 auto;position:relative;
  background:var(--md-surface);
  box-shadow:0 0 0 1px transparent;
}
@media(min-width:600px){
  #app{box-shadow:0 0 24px rgba(0,0,0,.12);}
}

/* ---------- 顶栏 Top App Bar ---------- */
.topbar{
  height:56px;display:flex;align-items:center;gap:4px;
  padding:0 4px 0 16px;
  background:var(--md-surface);
  color:var(--md-on-surface);
  position:relative;z-index:20;
  transition:background-color .25s ease;
}
.topbar-title{
  flex:1;font-size:20px;font-weight:500;letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity var(--md-dur-short) var(--md-easing-standard);
}
.topbar-title .title-suffix{opacity:.6;font-weight:400;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--md-on-surface-variant);
  position:relative;overflow:hidden;flex-shrink:0;
  transition:background-color var(--md-dur-short) var(--md-easing-standard),color var(--md-dur-short) var(--md-easing-standard),transform var(--md-dur-short) var(--md-easing-standard);
}
.icon-btn::before{
  content:"";position:absolute;inset:0;background:var(--md-on-surface);opacity:0;
  border-radius:50%;transition:opacity var(--md-dur-short) var(--md-easing-standard);
}
.icon-btn:hover::before{opacity:.08;}
.icon-btn:active::before{opacity:.12;}
.icon-btn .icon{font-size:24px;position:relative;z-index:1;transition:transform var(--md-dur-short) var(--md-easing-standard);}
.icon-btn:active .icon{transform:scale(.88);}
/* is-active 仅用于标识当前页面（如设置页的 home 按钮），不再填充背景色 */
.icon-btn.is-active{color:var(--md-on-surface);}
.icon-btn.is-active::before{display:none;}

/* ---------- 主页面容器（页面切换用） ---------- */
.main-area{
  flex:1;position:relative;overflow:hidden;
  background:var(--md-surface);
}
.page{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:transform var(--md-dur-long) var(--md-easing-emphasized),opacity var(--md-dur-medium) var(--md-easing-standard);
  will-change:transform,opacity;
}
.page.page-enter-right{transform:translateX(100%);opacity:0;pointer-events:none;}
.page.page-enter-left{transform:translateX(-100%);opacity:0;pointer-events:none;}
.page.page-active{transform:translateX(0);opacity:1;}
.page.page-leave-right{transform:translateX(100%);opacity:0;pointer-events:none;}
.page.page-leave-left{transform:translateX(-100%);opacity:0;pointer-events:none;}

/* ---------- 检查项列表 ---------- */
.list-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:8px 0 16px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  position:relative;
}
.list-scroll::-webkit-scrollbar{width:0;}

/* 检查项卡片 —— MD3 list item */
.check-item{
  display:flex;align-items:center;gap:16px;
  margin:0 16px 8px;padding:0 16px;
  height:64px;border-radius:16px;
  background:var(--md-surface-container-low);
  color:var(--md-on-surface);
  position:relative;overflow:hidden;
  transform-origin:center top;
  transition:
    height var(--md-dur-long) var(--md-easing-emphasized),
    min-height var(--md-dur-long) var(--md-easing-emphasized),
    background-color var(--md-dur-short) var(--md-easing-standard),
    transform var(--md-dur-medium) var(--md-easing-emphasized),
    opacity var(--md-dur-medium) var(--md-easing-standard),
    margin var(--md-dur-medium) var(--md-easing-emphasized),
    padding var(--md-dur-long) var(--md-easing-emphasized),
    border-radius var(--md-dur-medium) var(--md-easing-emphasized);
}
/* MD3 state layer（hover/press）—— 圆角裁剪由 .check-item 的 overflow:hidden 保证 */
.check-item::before{
  content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  border-radius:inherit;pointer-events:none;
  transition:opacity var(--md-dur-short) var(--md-easing-standard);
}
.check-item:hover::before{opacity:.08;}
.check-item:active::before{opacity:.12;}
.check-item.is-search-match{background:var(--md-secondary-container);color:var(--md-on-secondary-container);}
.check-item .ci-icon{
  font-size:24px;color:var(--md-primary);flex-shrink:0;width:24px;text-align:center;position:relative;z-index:1;
  transition:transform var(--md-dur-medium) var(--md-easing-emphasized),font-size var(--md-dur-long) var(--md-easing-emphasized),color var(--md-dur-short);
}
.check-item .ci-text{
  flex:1;font-size:16px;line-height:1.3;position:relative;z-index:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* ===== 检查项对勾按钮 ===== */
/* 始终显示为主题色(primary)背景+背景色(on-primary)对勾，无论完成与否 */
.check-item .ci-check{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--md-on-primary);
  border:none;
  position:relative;overflow:hidden;z-index:1;
  background:var(--md-primary);
  transition:transform var(--md-dur-short) var(--md-easing-standard),
             opacity var(--md-dur-short) var(--md-easing-standard);
}
/* state layer */
.check-item .ci-check::before{
  content:"";position:absolute;inset:0;background:var(--md-on-primary);opacity:0;border-radius:50%;
  transition:opacity var(--md-dur-short) var(--md-easing-standard);
}
.check-item .ci-check:hover::before{opacity:.08;}
.check-item .ci-check:active::before{opacity:.12;}
.check-item .ci-check:active{transform:scale(.9);}
/* 对勾图标始终可见 */
.check-item .ci-check .ci-check-icon{
  font-size:24px;position:relative;z-index:1;
  opacity:1;transform:scale(1);
}
/* 完成状态：文字变灰+删除线 */
.check-item.completed .ci-text{opacity:.5;text-decoration:line-through;}

/* 完成后移除动画：右滑淡出 → 高度收缩 */
.check-item.removing{
  opacity:0;transform:translateX(60px) scale(.85);
  height:0!important;min-height:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;
  border-radius:0!important;pointer-events:none;
}

/* 全部完成 - 咖啡态（与空状态共用大图标显示逻辑） */
.all-done{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:48px 24px;text-align:center;
  opacity:0;transform:scale(.96);
  transition:opacity var(--md-dur-long) var(--md-easing-emphasized-decelerate),transform var(--md-dur-long) var(--md-easing-emphasized-decelerate);
}
.all-done.show{opacity:1;transform:scale(1);}
.all-done .big-icon{
  font-size:96px;color:var(--md-primary);
}
.all-done .done-title{font-size:22px;font-weight:500;color:var(--md-on-surface);}
.all-done .done-sub{font-size:14px;color:var(--md-on-surface-variant);}

/* 列表项新增/移除 FLIP 容器 */
.list-container{position:relative;}

/* ---------- 底栏 Navigation Bar ---------- */
.bottombar{
  display:flex;align-items:stretch;
  background:var(--md-surface-container);
  color:var(--md-on-surface);
  position:relative;z-index:20;
  border-top:1px solid transparent;
  overflow:hidden;
  transition:background-color .25s ease;
}
.bottombar-scroll{
  display:flex;align-items:stretch;
  overflow-x:auto;overflow-y:hidden;
  scroll-behavior:smooth;
  flex:1;
  scrollbar-width:none;-ms-overflow-style:none;
}
.bottombar-scroll::-webkit-scrollbar{display:none;}
.nav-tab{
  flex:0 0 auto;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:8px 12px 12px;
  color:var(--md-on-surface-variant);
  position:relative;overflow:visible;
  min-width:80px;background:transparent;
  transition:color var(--md-dur-short) var(--md-easing-standard);
}
.nav-tab .tab-icon-pill{
  width:64px;height:32px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  transition:background-color var(--md-dur-medium) var(--md-easing-standard);
  position:relative;
}
.nav-tab .tab-icon-pill .icon{font-size:24px;transition:transform var(--md-dur-short) var(--md-easing-standard);}
.nav-tab .tab-label{
  font-size:12px;font-weight:500;max-width:72px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity var(--md-dur-short);
}
.nav-tab.is-active{color:var(--md-on-surface);}
.nav-tab.is-active .tab-icon-pill{background:var(--md-secondary-container);color:var(--md-on-secondary-container);}
.nav-tab.is-active .tab-icon-pill .icon{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
.nav-tab.is-active .tab-label{font-weight:600;}
/* MD3 state layer：限制在图标 pill 区域，圆角，避免突兀矩形 */
.nav-tab .tab-icon-pill::before{
  content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  border-radius:inherit;transition:opacity var(--md-dur-short) var(--md-easing-standard);
}
.nav-tab:hover .tab-icon-pill::before{opacity:.08;}
.nav-tab:active .tab-icon-pill::before{opacity:.12;}
/* 新增标签动画 */
.nav-tab.tab-enter{animation:tab-grow var(--md-dur-long) var(--md-easing-emphasized-decelerate);}
@keyframes tab-grow{from{opacity:0;transform:scale(.6);max-width:0;padding-left:0;padding-right:0;}to{opacity:1;transform:scale(1);}}
/* 删除标签动画 */
.nav-tab.tab-leave{animation:tab-shrink var(--md-dur-medium) var(--md-easing-emphasized-accelerate) forwards;pointer-events:none;}
@keyframes tab-shrink{to{opacity:0;transform:scale(.6);max-width:0;padding-left:0;padding-right:0;margin:0;}}

/* ---------- 普通按钮（FAB / Button） ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 24px;border-radius:20px;
  font-size:14px;font-weight:500;letter-spacing:.1px;
  background:var(--md-primary);color:var(--md-on-primary);
  position:relative;overflow:hidden;
  transition:background-color var(--md-dur-short) var(--md-easing-standard),box-shadow var(--md-dur-short),transform var(--md-dur-short);
}
.btn::before{content:"";position:absolute;inset:0;background:var(--md-on-primary);opacity:0;transition:opacity var(--md-dur-short);}
.btn:hover::before{opacity:.08;}
.btn:active{transform:scale(.97);}
.btn:active::before{opacity:.12;}
.btn .icon{font-size:18px;}
.btn.btn-tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container);}
.btn.btn-tonal::before{background:var(--md-on-secondary-container);}
.btn.btn-outlined{background:transparent;color:var(--md-primary);border:1px solid var(--md-outline);}
.btn.btn-outlined::before{background:var(--md-primary);}
.btn.btn-text{background:transparent;color:var(--md-primary);}
.btn.btn-text::before{background:var(--md-primary);}
.btn.btn-error{background:var(--md-error);color:var(--md-on-error);}
.btn.btn-error::before{background:var(--md-on-error);}
.btn:disabled{opacity:.38;pointer-events:none;}
.btn.btn-large{height:48px;padding:0 32px;border-radius:24px;font-size:15px;}

/* FAB 悬浮按钮 */
.fab{
  position:absolute;width:56px;height:56px;border-radius:18px;
  background:var(--md-primary-container);color:var(--md-on-primary-container);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  z-index:15;overflow:hidden;
  transition:transform var(--md-dur-medium) var(--md-easing-emphasized),box-shadow var(--md-dur-short),opacity var(--md-dur-medium) var(--md-easing-standard),scale var(--md-dur-medium) var(--md-easing-emphasized);
}
.fab::before{content:"";position:absolute;inset:0;background:var(--md-on-primary-container);opacity:0;transition:opacity var(--md-dur-short);}
.fab:hover::before{opacity:.1;}
.fab:active{transform:scale(.92);box-shadow:0 2px 6px rgba(0,0,0,.2);}
.fab .icon{font-size:24px;position:relative;z-index:1;}

/* 重置 FAB：默认隐藏，全部完成时显示。右下角，距底栏上方 16px */
.reset-fab{
  right:16px;bottom:16px;
  opacity:0;transform:scale(.4) translateY(20px);pointer-events:none;
}
.reset-fab.visible{
  opacity:1;transform:scale(1) translateY(0);pointer-events:auto;
}

/* ---------- 新建/编辑检查单页面 ---------- */
.form-page-content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:8px 0 24px;
  -webkit-overflow-scrolling:touch;
}
.form-page-content::-webkit-scrollbar{width:0;}
.form-section{padding:16px;}
.form-label{
  font-size:12px;font-weight:500;color:var(--md-on-surface-variant);
  letter-spacing:.4px;text-transform:none;
  margin-bottom:8px;display:block;padding:0 4px;
}
.section-title{
  font-size:14px;font-weight:500;color:var(--md-primary);
  padding:24px 16px 8px;letter-spacing:.1px;
}

/* 图标选择网格 */
.icon-picker-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
  padding:8px;
}
.icon-option{
  aspect-ratio:1;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:var(--md-on-surface-variant);
  background:var(--md-surface-container-low);
  position:relative;overflow:hidden;
  transition:background-color var(--md-dur-short) var(--md-easing-standard),color var(--md-dur-short),transform var(--md-dur-short);
}
.icon-option::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity var(--md-dur-short);}
.icon-option:hover::before{opacity:.08;}

/* 开关 Switch（MD3 完整重写）

   关闭：球 12px，左侧距边 8px
   开启：球 24px，右侧距边 8px
   按下：球横向拉伸 */
.switch{
  width:52px;height:32px;border-radius:16px;
  background:var(--md-surface-container-highest);
  border:2px solid var(--md-outline);
  position:relative;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;
  transition:background-color var(--md-dur-medium) var(--md-easing-standard),border-color var(--md-dur-medium) var(--md-easing-standard);
}
.switch .switch-thumb{
  position:absolute;
  width:12px;height:12px;border-radius:50%;
  background:var(--md-outline);
  /* 关闭：球在左侧，距左 border 6px（8-2border），用 left 定位 */
  left:6px;
  top:50%;transform:translateY(-50%);
  transition:left var(--md-dur-medium) var(--md-easing-emphasized),
             width var(--md-dur-medium) var(--md-easing-emphasized),
             height var(--md-dur-medium) var(--md-easing-emphasized),
             background-color var(--md-dur-medium) var(--md-easing-standard);
}
.switch.on{background:var(--md-primary);border-color:var(--md-primary);}
/* 开启：球 24px，移到右侧。left = 52 - 2(border) - 24 - 6 = 20px */
.switch.on .switch-thumb{left:22px;width:24px;height:24px;background:var(--md-on-primary);}
/* 按下时球横向拉伸（MD3 规范） */
.switch:active:not(.on) .switch-thumb{width:18px;}
.switch.on:active .switch-thumb{width:28px;}

/* ---------- 状态管理 ---------- */
const Store = {
  key:'checklist_app_state_v1',
  state:null,
  listeners:[],
  load(){
    try{
      const raw = localStorage.getItem(this.key);
      if(raw){
        this.state = JSON.parse(raw);
        // 合并默认设置（防止旧版本字段缺失）
        this.state.settings = Object.assign({...DEFAULT_SETTINGS}, this.state.settings||{});
      }else{
        this.state = {checklists:[], activeChecklistId:null, settings:{...DEFAULT_SETTINGS}};
      }
    }catch(e){
      this.state = {checklists:[], activeChecklistId:null, settings:{...DEFAULT_SETTINGS}};
    }
    // 数据校验
    if(!Array.isArray(this.state.checklists)) this.state.checklists = [];
    if(!this.state.settings) this.state.settings = {...DEFAULT_SETTINGS};
  },
  save(){
    try{ localStorage.setItem(this.key, JSON.stringify(this.state)); }catch(e){}
  },
  subscribe(fn){ this.listeners.push(fn); },
  emit(){ this.listeners.forEach(fn=>fn(this.state)); },
  set(partial){ Object.assign(this.state, partial); this.save(); this.emit(); },
};

/* ---------- 工具函数 ---------- */
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $ = (sel,root=document)=> root.querySelector(sel);
const $$ = (sel,root=document)=> Array.from(root.querySelectorAll(sel));
function el(tag, props={}, children=[]){
  const e = document.createElement(tag);
  // 布尔属性：值为 false 时不设置（HTML 规范中属性存在即为真）
  const BOOL_ATTRS = ['disabled','checked','selected','readonly','multiple','hidden','autoplay','controls','loop','muted','open','required'];
  Object.entries(props).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='text') e.textContent=v;
    else if(k.startsWith('on')&&typeof v==='function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='dataset') Object.entries(v).forEach(([dk,dv])=>e.dataset[dk]=dv);
    else if(BOOL_ATTRS.includes(k)){
      if(v) e.setAttribute(k,''); else e.removeAttribute(k);
    }
    else if(v!==null&&v!==undefined&&v!==false) e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    if(typeof c==='string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
/* ---------- MD3 水滴效果（Ripple） ----------
   为可交互元素附加点击水滴动画。元素需有 position:relative 和 overflow:hidden。
   水滴会被父元素的 border-radius 裁剪，确保圆角区域不溢出。 */
function attachRipple(el){
  el._rippleAttached = true;
  el.addEventListener('pointerdown', e=>{
    // 仅对主按键响应
    if(e.button!==0 && e.pointerType==='mouse') return;
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size/2;
    const y = e.clientY - rect.top - size/2;
    const ripple = document.createElement('span');
    ripple.className = 'md-ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.style.width = ripple.style.height = size + 'px';
    el.appendChild(ripple);
    // 主动画结束后移除
    const cleanup = ()=>{ ripple.remove(); el.removeEventListener('pointerup', cleanup); el.removeEventListener('pointerleave', cleanup); };
    el.addEventListener('pointerup', cleanup);
    el.addEventListener('pointerleave', cleanup);
    // 兜底清理
    setTimeout(()=>ripple.remove(), 700);
  });
}
/* 全局水波效果委托：自动给匹配选择器的元素添加 ripple，无需手动 attach。
   匹配的元素需要 position:relative + overflow:hidden 以裁剪圆角。 */
const RIPPLE_SELECTOR = '.btn,.seg-btn,.chip,.settings-item.clickable,.dropdown-header.clickable,.lang-item,.icon-option,.icon-circle-btn,.nav-tab .tab-icon-pill,.icon-btn,.fab,.ci-check,.check-item,.fi-icon-btn,.fi-remove';
function initGlobalRipple(){
  document.addEventListener('pointerdown', e=>{
    if(e.button!==0 && e.pointerType==='mouse') return;
    const target = e.target.closest(RIPPLE_SELECTOR);
    if(!target) return;
    // 已通过 attachRipple 处理的元素跳过（避免重复）
    if(target._rippleAttached) return;
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size/2;
    const y = e.clientY - rect.top - size/2;
    const ripple = document.createElement('span');
    ripple.className = 'md-ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.style.width = ripple.style.height = size + 'px';
    target.appendChild(ripple);
    setTimeout(()=>ripple.remove(), 550);
  }, {capture:true});
}
function autoIconFor(text){
  if(!text) return 'checklist';
  const lower = text.toLowerCase();
  for(const [pattern, icon] of AUTO_ICON_KEYWORDS){
    const parts = pattern.split('|');
    for(const p of parts){
      if(lower.includes(p.toLowerCase())) return icon;
    }
  }
  return 'checklist';
}
function resolveIcon(iconName, fallbackText){
  // 返回实际图标名：若用户提供则用，否则自动选
  if(iconName && iconName!=='auto' && ICON_LIBRARY.includes(iconName)) return iconName;
  return autoIconFor(fallbackText||'');
}

/* ---------- i18n 取词 ---------- */
function getLang(){
  const s = Store.state.settings.language;
  if(s==='auto'){
    const nav = navigator.language || 'zh-CN';
    // 精确匹配
    if(I18N[nav]) return nav;
    // 前缀匹配
    const prefix = nav.split('-')[0];
    if(I18N[prefix]) return prefix;
    return 'zh-CN';
  }
  return I18N[s] ? s : 'zh-CN';
}
function t(key){
  const lang = getLang();
  return (I18N[lang] && I18N[lang][key]) || I18N['zh-CN'][key] || key;
}

/* ---------- 主题应用 ---------- */
function applyTheme(){
  const s = Store.state.settings.theme;
  let dark;
  if(s==='auto'){
    dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }else{
    dark = s==='dark';
  }
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.content = dark?'#131318':'#FCF8FF';
}

/* ---------- 主页面渲染 ---------- */
let currentHomeView = 'list'; // list | empty | alldone

function renderHome(){
  const container = $('#listContainer');
  const resetFab = $('#btnResetList');
  const cl = getActiveChecklist();

  // 清空
  container.innerHTML='';

  if(!cl){
    // 无检查单 - 自动跳到新建页面，不显示空状态
    resetFab.classList.remove('visible');
    if(currentPage==='home'){
      openForm(null);
    }
    return;
  }

  const pendingItems = cl.items.filter(i=>!i.done);
  if(cl.items.length===0 || pendingItems.length===0){
    // 全部完成 - 显示重置 FAB
    showHomeView('alldone');
    resetFab.classList.add('visible');
    return;
  }

  showHomeView('list');
  resetFab.classList.remove('visible');

  const settings = Store.state.settings;
  // FLIP：记录旧位置
  const oldRects = new Map();
  $$('.check-item', container).forEach(node=>{
    oldRects.set(node.dataset.id, node.getBoundingClientRect());
  });

  // 渲染待办项
  pendingItems.forEach((item, idx)=>{
    const isFirst = idx===0;
    const useCustom = isFirst || !settings.firstOnly;
    const height = useCustom? settings.itemHeight : 64;
    const iconName = resolveIcon(item.icon, item.text);

    const node = el('div', {class:'check-item', dataset:{id:item.id}});
    node.style.height = height+'px';

    const iconEl = el('span', {class:'icon ci-icon'}, iconName);
    const textEl = el('div', {class:'ci-text'}, item.text);
    const checkBtn = el('button', {class:'ci-check', 'aria-label':t('confirm'), onclick:(e)=>{
      e.stopPropagation();
      completeItem(cl.id, item.id);
    }});
    checkBtn.appendChild(el('span', {class:'icon ci-check-icon'}, 'check'));
    // 附加水滴效果
    attachRipple(checkBtn);

    node.appendChild(iconEl);
    node.appendChild(textEl);
    node.appendChild(checkBtn);
    container.appendChild(node);
  });

  // FLIP 补位动画
  requestAnimationFrame(()=>{
    $$('.check-item', container).forEach(node=>{
      const old = oldRects.get(node.dataset.id);
      if(old){
        const neW = node.getBoundingClientRect();
        const dy = old.top - neW.top;
        if(Math.abs(dy)>1){
          node.style.transform = `translateY(${dy}px)`;
          node.style.transition='none';
          requestAnimationFrame(()=>{
            node.style.transition='';
            node.style.transform='';
          });
        }
      }
    });
  });
}

/* ---------- 完成检查项（带动画） ----------
   彻底重写：直接操作 DOM，不重新渲染整个列表。
   流程：1.勾选填充 → 2.右滑淡出+高度收缩 → 3.移除节点 → 4.新的第一项布局过渡
   这样下方项会随高度收缩自然上移，无需 FLIP，不会瞬移。 */
function completeItem(clId, itemId){
  const cl = Store.state.checklists.find(c=>c.id===clId);
  if(!cl) return;
  const item = cl.items.find(i=>i.id===itemId);
  if(!item) return;

  const node = $(`.check-item[data-id="${itemId}"]`);
  if(node){
    // 1. 勾选填充动画（200ms）
    node.classList.add('completed');
    setTimeout(()=>{
      // 2. 移除动画：右滑淡出 + 高度收缩（CSS transition 自然带动下方项上移）
      node.classList.add('removing');
      // 3. 等待移除动画完成
      setTimeout(()=>{
        // 更新数据
        item.done = true;
        const allDone = cl.items.every(i=>i.done);
        if(allDone) cl.completedAt = Date.now();
        Store.save();
        // 从 DOM 移除已完成节点
        node.remove();
        renderBottombar();
        checkAutoReset();
        // 4. 如果还有待办项，新的第一项高度可能需要更新
        const pendingItems = cl.items.filter(i=>!i.done);
        if(pendingItems.length === 0){
          // 全部完成：显示咖啡态
          showHomeView('alldone');
          $('#btnResetList').classList.add('visible');
        }else{
          // 更新新的第一项的高度
          updateFirstItemHeight();
        }
      }, 400);
    }, 200);
  }else{
    item.done = true;
    const allDone = cl.items.every(i=>i.done);
    if(allDone) cl.completedAt = Date.now();
    Store.save();
    renderHome();
    renderBottombar();
  }
}

/* 更新第一项的高度（firstOnly 模式下，新的第一项使用自定义高度） */

  const settings = Store.state.settings;

  const firstNode = container.querySelector('.check-item');
  if(!firstNode) return;
  firstNode.style.height = settings.itemHeight + 'px';
}


/* ---------- 重置检查单 ---------- */
function resetChecklist(clId){
  const cl = Store.state.checklists.find(c=>c.id===clId);
  if(!cl) return;
  cl.items.forEach(i=>i.done=false);
  cl.completedAt = null;
  Store.save();
  renderHome();
  renderBottombar();
  showToast(t('reset_toast'));
}

/* ---------- 自动重置检查 ---------- */
function checkAutoReset(){
  const now = Date.now();
  let changed = false;
  Store.state.checklists.forEach(cl=>{
    if(cl.completedAt && cl.resetHours && cl.resetHours>0){
      const elapsed = (now - cl.completedAt)/3600000;
      if(elapsed >= cl.resetHours){
        cl.items.forEach(i=>i.done=false);
        cl.completedAt = null;
        changed = true;
      }
    }
  });
  if(changed){ Store.save(); renderHome(); renderBottombar(); }
}
// 每分钟检查一次自动重置
setInterval(checkAutoReset, 60000);

/* ---------- 底栏渲染 ---------- */
function renderBottombar(newTabId){
  const scroll = $('#bottombarScroll');
  scroll.innerHTML='';

  // 检查单标签 —— 仅在主页且为当前活动检查单时高亮
  Store.state.checklists.forEach(cl=>{
    const active = currentPage==='home' && cl.id===Store.state.activeChecklistId;
    const iconName = resolveIcon(cl.icon, cl.name);
    // 新增的标签应用入场动画
    const isNew = cl.id===newTabId;
    const tab = el('button', {class:'nav-tab'+(active?' is-active':'')+(isNew?' tab-enter':''), dataset:{id:cl.id}, onclick:()=>switchChecklist(cl.id)});
    const pill = el('div', {class:'tab-icon-pill'}, el('span', {class:'icon'}, iconName));
    attachRipple(pill);
    const label = el('div', {class:'tab-label'}, cl.name || t('checklist'));
    tab.appendChild(pill);
    tab.appendChild(label);
    scroll.appendChild(tab);
    // 动画结束后移除入场类
    if(isNew){
      tab.addEventListener('animationend', ()=>tab.classList.remove('tab-enter'), {once:true});
    }
  });

  // 新建标签 —— 在表单页（新建模式）时高亮
  const newTabActive = currentPage==='form' && !Store.state._editing;
  const newTab = el('button', {class:'nav-tab'+(newTabActive?' is-active':''), id:'newTab', onclick:()=>openForm(null)});
  const newPill = el('div', {class:'tab-icon-pill'}, el('span', {class:'icon'}, 'add'));
  attachRipple(newPill);
  newTab.appendChild(newPill);
  newTab.appendChild(el('div', {class:'tab-label'}, t('new_tab')));
  scroll.appendChild(newTab);

  // 滚动到活动标签
  setTimeout(()=>{
    const active = $('.nav-tab.is-active', scroll);
    if(active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }, 50);

function switchChecklist(clId){
  // 判断切换方向（基于底栏标签顺序）
  const oldId = Store.state.activeChecklistId;
  const lists = Store.state.checklists;
  const oldIdx = lists.findIndex(c=>c.id===oldId);
  const newIdx = lists.findIndex(c=>c.id===clId);
  const goRight = newIdx > oldIdx;

  Store.set({activeChecklistId:clId});
  if(currentPage!=='home'){
    switchPage('home');
  }
  renderTopbar('home');
  renderBottombar();
  closeSearch(true);

  // 丝滑左右滑动切换：旧内容滑出 → 渲染新内容 → 新内容滑入
  const container = $('#listContainer');
  if(container && oldId !== clId){
    const dir = goRight ? -1 : 1;  // 滑出方向
    const enterDir = goRight ? 1 : -1;  // 滑入方向
    // 1. 旧内容滑出（加速曲线，150ms）
    container.style.transition = 'transform 150ms cubic-bezier(.3,0,.8,.15), opacity 120ms cubic-bezier(.3,0,.8,.15)';
    container.style.transform = `translateX(${dir*40}px)`;
    container.style.opacity = '0';
    setTimeout(()=>{
      // 2. 渲染新内容
      renderHome();
      // 3. 新内容从反方向无过渡地定位
      container.style.transition = 'none';
      container.style.transform = `translateX(${enterDir*40}px)`;
      container.style.opacity = '0';
      // 4. 下一帧滑入（减速曲线，丝滑）
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        container.style.transition = 'transform 300ms cubic-bezier(.05,.7,.1,1), opacity 250ms cubic-bezier(.05,.7,.1,1)';
        container.style.transform = 'translateX(0)';
        container.style.opacity = '1';
        // 过渡结束后清理 inline 样式
        setTimeout(()=>{
          container.style.transition = '';
          container.style.transform = '';
          container.style.opacity = '';
        }, 320);
      }));
    }, 150);
  }else{
    renderHome();
  }
}

    const btn = el('button', {class:'icon-circle-btn'+(sel?' selected':''), onclick:()=>{

  if(isAuto && !autoInCommon){
    const previewBtn = el('button', {class:'icon-circle-btn selected preview-btn', onclick:()=>openIconPicker('checklist')});
    previewBtn.appendChild(el('span', {class:'icon'}, autoIcon));
    attachRipple(previewBtn);
    row.insertBefore(previewBtn, moreBtn);
  }
  // 如果手动选了非常用图标，也显示预览按钮
  if(!isAuto && !CHECKLIST_COMMON_ICONS.includes(formState.icon)){

function renderForm(){
  const content = $('#formContent');
  const editing = Store.state._editing;

  content.innerHTML='';
  // 表单内容区 + 底部按钮区（按钮跟随滚动）
  const formBody = el('div', {class:'form-body'});

  // 检查单图标选择 —— 7个圆按钮（6常用图标 + 更多按钮）
  formBody.appendChild(el('div', {class:'form-section'}, [
    el('label', {class:'form-label'}, t('checklist_icon')),
    renderChecklistIconRow()
  ]));

  // 名称输入
  formBody.appendChild(el('div', {class:'form-section'}, [
    el('label', {class:'form-label'}, t('checklist_name')),
    el('div', {class:'text-field'}, [
      (()=>{
        const input = el('input', {type:'text', value:formState.name, placeholder:t('checklist_name')});
        input.addEventListener('input', e=>{
          formState.name = e.target.value;
          // 若检查单图标为自动，即时更新图标行预览（不重新渲染整个表单，保持焦点）
          if(formState.icon==='auto'){
            refreshChecklistIconRow();
          }
        });
        return input;
      })()
    ])
  ]));

  // 重置时间 —— 下拉菜单选择（需求3）
  formBody.appendChild(el('div', {class:'form-section'}, [
    el('label', {class:'form-label'}, t('reset_time')),
    (()=>{
      const dd = el('div', {class:'dropdown form-dropdown'});
      const header = el('div', {class:'dropdown-header clickable', onclick:()=>{
        const willOpen = !dd.classList.contains('open');
        const body = dd.querySelector('.dropdown-body');
        if(willOpen){
          dd.classList.add('open');
          body.style.maxHeight = body.scrollHeight + 'px';
        }else{
          body.style.maxHeight = body.scrollHeight + 'px';
          void body.offsetHeight;
          body.style.maxHeight = '0px';
          dd.classList.remove('open');
        }
      }});
      const curText = formState.resetHours>0 ? `${formState.resetHours} ${t('hours')}` : t('never_reset');
      header.appendChild(el('span', {class:'icon dh-icon'}, 'schedule'));
      header.appendChild(el('span', {class:'dh-title'}, curText));
      header.appendChild(el('span', {class:'icon dh-arrow'}, 'expand_more'));
      attachRipple(header);
      dd.appendChild(header);
      const body = el('div', {class:'dropdown-body'});
      const inner = el('div', {class:'dropdown-body-inner'});
      const options = [0,1,2,4,6,8,12,24,48,72];
      options.forEach(h=>{
        const sel = formState.resetHours===h;
        const opt = el('div', {class:'lang-item'+(sel?' selected':''), onclick:()=>{
          formState.resetHours=h;
          // 先播放收起动画，再重新渲染表单
          const bodyEl = dd.querySelector('.dropdown-body');
          bodyEl.style.maxHeight = bodyEl.scrollHeight + 'px';
          void bodyEl.offsetHeight;
          bodyEl.style.maxHeight = '0px';
          dd.classList.remove('open');
          // 更新 header 文本（即时反馈）
          header.querySelector('.dh-title').textContent = h===0 ? t('never_reset') : `${h} ${t('hours')}`;
          // 收起动画结束后重新渲染（更新选项选中状态）
          setTimeout(()=>renderForm(), 400);
        }});
        opt.appendChild(el('span', {class:'icon si-icon', style:sel?'color:var(--md-primary)':''}, sel?'check':'schedule'));
        opt.appendChild(el('div', {class:'si-text'}, el('div', {class:'si-title'}, h===0? t('never_reset') : `${h} ${t('hours')}`)));
        inner.appendChild(opt);
      });
      body.appendChild(inner);
      dd.appendChild(body);
      return dd;
    })()
  ]));

  // 检查项
  formBody.appendChild(el('div', {class:'form-section'}, [
    el('label', {class:'form-label'}, t('add_check_item')),
    (()=>{
      const wrap = el('div', {id:'formItemsWrap'});
      renderFormItems(wrap);
      return wrap;
    })()
  ]));

  content.appendChild(formBody);

  // 按钮 —— 嵌入 formContent 末尾，跟随滚动（需求13）
  const actions = el('div', {class:'form-actions', id:'formActions'});
  if(editing){
    actions.appendChild(el('button', {class:'btn btn-large btn-error', id:'btnDelete', onclick:handleDelete}, [
      el('span', {class:'icon'}, 'delete'), t('delete_checklist')
    ]));
    actions.appendChild(el('button', {class:'btn btn-large', onclick:handleSave}, [
      el('span', {class:'icon'}, 'save'), t('save_changes')
    ]));
  }else{
    actions.appendChild(el('button', {class:'btn btn-large', onclick:handleConfirm}, [
      el('span', {class:'icon'}, 'check'), t('confirm')
    ]));
  }
  content.appendChild(actions);
}

function renderFormItems(wrap){
  wrap.innerHTML='';
  // 确保最后总有一个空行供继续输入
  const last = formState.items[formState.items.length-1];
  if(!last || last.text.trim()) {
    formState.items.push({id:uid(), text:'', icon:'auto'});
  }
  formState.items.forEach((item, idx)=>{
    const hasContent = item.text.trim().length>0;
    const fi = el('div', {class:'form-item'+(hasContent?' has-content':''), dataset:{id:item.id}});
    // 图标按钮
    const iconBtn = el('button', {class:'fi-icon-btn'+(item.icon!=='auto'?' has-icon':''), onclick:()=>openIconPicker('item', item.id)});
    iconBtn.appendChild(el('span', {class:'icon'}, item.icon==='auto'? (hasContent?autoIconFor(item.text):'add_circle') : resolveIcon(item.icon, item.text)));
    attachRipple(iconBtn);
    fi.appendChild(iconBtn);
    // 输入框
    const tf = el('div', {class:'text-field fi-input'});
    const input = el('input', {type:'text', value:item.text, placeholder:t('check_item_placeholder')});
    // 记录当前聚焦元素，避免重新渲染时丢失焦点（需求4）
    const focusedId = document.activeElement && document.activeElement.tagName==='INPUT' ? document.activeElement.closest('.form-item')?.dataset?.id : null;
    input.addEventListener('input', e=>{
      item.text = e.target.value;
      const hc = item.text.trim().length>0;
      fi.classList.toggle('has-content', hc);
      // 自动图标预览更新
      if(item.icon==='auto'){
        iconBtn.querySelector('.icon').textContent = hc? autoIconFor(item.text) : 'add_circle';
      }
      // 若是最后一条且有内容，新增一条空行（不抢焦点，不重新渲染当前行）
      if(idx===formState.items.length-1 && hc){
        const newId = uid();
        formState.items.push({id:newId, text:'', icon:'auto'});
        // 仅追加新行，不重新渲染所有行，保持当前焦点
        appendFormItem(wrap, newId);
      }
    });
    tf.appendChild(input);
    fi.appendChild(tf);
    // 删除按钮
    const rmBtn = el('button', {class:'fi-remove', onclick:()=>{
      if(formState.items.length<=1){
        // 仅清空
        item.text=''; item.icon='auto';
        renderFormItems(wrap);
        return;
      }
      fi.classList.add('removing');
      setTimeout(()=>{
        formState.items = formState.items.filter(i=>i.id!==item.id);
        renderFormItems(wrap);
      }, 250);
    }});
    rmBtn.appendChild(el('span', {class:'icon'}, 'close'));
    fi.appendChild(rmBtn);
    wrap.appendChild(fi);
    // 恢复焦点
    if(focusedId===item.id){
      requestAnimationFrame(()=>input.focus());
      // 将光标放到末尾
      const len = input.value.length;
      requestAnimationFrame(()=>{ input.setSelectionRange(len,len); });
    }
  });
}

/* 追加单个表单项（不重新渲染全部，避免抢焦点） */
function appendFormItem(wrap, itemId){
  const item = formState.items.find(i=>i.id===itemId);
  if(!item) return;
  const fi = el('div', {class:'form-item', dataset:{id:item.id}});
  const iconBtn = el('button', {class:'fi-icon-btn', onclick:()=>openIconPicker('item', item.id)});
  iconBtn.appendChild(el('span', {class:'icon'}, 'add_circle'));
  attachRipple(iconBtn);
  fi.appendChild(iconBtn);
  const tf = el('div', {class:'text-field fi-input'});
  const input = el('input', {type:'text', value:item.text, placeholder:t('check_item_placeholder')});
  input.addEventListener('input', e=>{
    item.text = e.target.value;
    const hc = item.text.trim().length>0;
    fi.classList.toggle('has-content', hc);
    if(item.icon==='auto'){
      iconBtn.querySelector('.icon').textContent = hc? autoIconFor(item.text) : 'add_circle';
    }
    if(item.id===formState.items[formState.items.length-1].id && hc){
      const newId = uid();
      formState.items.push({id:newId, text:'', icon:'auto'});
      appendFormItem(wrap, newId);
    }
  });
  tf.appendChild(input);
  fi.appendChild(tf);
  const rmBtn = el('button', {class:'fi-remove', onclick:()=>{
    if(formState.items.length<=1){ item.text=''; item.icon='auto'; renderFormItems(wrap); return; }
    fi.classList.add('removing');
    setTimeout(()=>{ formState.items = formState.items.filter(i=>i.id!==item.id); renderFormItems(wrap); }, 250);
  }});
  rmBtn.appendChild(el('span', {class:'icon'}, 'close'));
  fi.appendChild(rmBtn);
  wrap.appendChild(fi);
}

function handleConfirm(){
  const name = formState.name.trim();
  if(!name){
    showToast(t('enter_checklist_name'));
    return;
  }
  const items = formState.items.filter(i=>i.text.trim()).map(i=>({id:i.id, text:i.text.trim(), icon:i.icon, done:false}));
  if(items.length===0){
    showToast(t('enter_check_item'));
    return;
  }
  const newCl = {
    id:uid(), name, icon:formState.icon, resetHours:formState.resetHours,
    items, completedAt:null, createdAt:Date.now()
  };
  Store.state.checklists.push(newCl);
  Store.state.activeChecklistId = newCl.id;
  Store.state._editing = null;
  Store.save(); Store.emit();
  switchPage('home');
  renderTopbar('home');
  renderHome();
  renderBottombar(newCl.id);
  showToast(t('added_toast'));
}

function handleSave(){
  const editing = Store.state._editing;
  const cl = Store.state.checklists.find(c=>c.id===editing);
  if(!cl) return;
  const name = formState.name.trim();
  if(!name){ showToast(t('enter_checklist_name')); return; }
  const items = formState.items.filter(i=>i.text.trim()).map(i=>{
    const old = cl.items.find(o=>o.id===i.id);
    return {id:i.id, text:i.text.trim(), icon:i.icon, done: old? old.done : false};
  });
  if(items.length===0){ showToast(t('enter_check_item')); return; }
  cl.name = name;
  cl.icon = formState.icon;
  cl.resetHours = formState.resetHours;
  cl.items = items;
  // 检查是否仍全部完成
  const allDone = cl.items.every(i=>i.done);
  cl.completedAt = allDone? (cl.completedAt||Date.now()) : null;
  Store.state._editing = null;
  Store.save(); Store.emit();
  switchPage('home');
  renderTopbar('home');
  renderHome();
  renderBottombar();
  showToast(t('saved_toast'));
}

let deleteConfirmTimer = null;
function handleDelete(){
  const btn = $('#btnDelete');
  if(!btn) return;
  if(!btn.dataset.armed){
    btn.dataset.armed='1';
    btn.textContent='';
    btn.appendChild(el('span', {class:'icon'}, 'warning'));
    btn.appendChild(document.createTextNode(t('delete')));
    showToast(t('delete_confirm_body'));
    deleteConfirmTimer = setTimeout(()=>{
      btn.removeAttribute('data-armed');
      btn.textContent='';
      btn.appendChild(el('span', {class:'icon'}, 'delete'));
      btn.appendChild(document.createTextNode(t('delete')));
    }, 3000);
  }else{
    clearTimeout(deleteConfirmTimer);
    const editing = Store.state._editing;
    // 先播放底栏标签移除动画
    const removingTab = $(`.nav-tab[data-id="${editing}"]`);
    const finishDelete = ()=>{
      Store.state.checklists = Store.state.checklists.filter(c=>c.id!==editing);
      // 选第一个检查单或 null
      Store.state.activeChecklistId = Store.state.checklists[0]? Store.state.checklists[0].id : null;
      Store.state._editing = null;
      Store.save(); Store.emit();
      renderBottombar();
      showToast(t('deleted_toast'));
      if(Store.state.checklists.length === 0){
        // 没有检查单了，直接跳到新建页面
        openForm(null);
      }else{
        switchPage('home');
        renderTopbar('home');
        renderHome();
      }
    };
    if(removingTab){
      let done = false;
      const finishOnce = ()=>{
        if(done) return; done = true;
        finishDelete();
      };
      removingTab.classList.add('tab-leave');
      removingTab.addEventListener('animationend', finishOnce, {once:true});
      // 兜底：若动画事件未触发，450ms 后强制完成
      setTimeout(finishOnce, 450);
    }else{
      finishDelete();
    }
  }
}

/* ---------- 设置页面 ---------- */
function renderSettings(){
  const content = $('#settingsContent');
  const s = Store.state.settings;
  content.innerHTML='';

  // 主题
  content.appendChild(el('div', {class:'section-title'}, t('settings_theme')));
  const themeGroup = el('div', {class:'settings-group'});
  // 跟随系统
  const followItem = el('div', {class:'settings-item'});
  followItem.appendChild(el('span', {class:'icon si-icon'}, 'brightness_auto'));
  followItem.appendChild(el('div', {class:'si-text'}, [el('div',{class:'si-title'}, t('settings_follow_system'))]));
  const followSwitch = el('div', {class:'switch'+(s.theme==='auto'?' on':''), onclick:()=>{
    s.theme = s.theme==='auto'? 'light' : 'auto';
    Store.save(); applyTheme(); renderSettings();
  }});
  followSwitch.appendChild(el('div', {class:'switch-thumb'}));
  followItem.appendChild(followSwitch);
  themeGroup.appendChild(followItem);
  // 浅/深色选择（跟随系统时禁用）
  const modeDisabled = s.theme==='auto';
  const modeRow = el('div', {class:'seg-buttons'+(modeDisabled?' disabled':'')});
  ['light','dark'].forEach(mode=>{
    const sel = s.theme===mode;
    const btn = el('button', {class:'seg-btn'+(sel?' selected':'')+(modeDisabled?' disabled':''), disabled:modeDisabled, onclick:()=>{
      if(modeDisabled) return;
      s.theme = mode; Store.save(); applyTheme(); renderSettings();
    }}, [
      el('span', {class:'icon'}, mode==='light'?'light_mode':'dark_mode'),
      mode==='light'? t('settings_light') : t('settings_dark')
    ]);
    modeRow.appendChild(btn);
  });
  themeGroup.appendChild(modeRow);
  content.appendChild(themeGroup);

  // 检查项高度
  content.appendChild(el('div', {class:'section-title'}, t('settings_item_height')));
  const heightGroup = el('div', {class:'settings-group'});
  const heightItem = el('div', {class:'settings-item'});
  heightItem.appendChild(el('span', {class:'icon si-icon'}, 'format_line_spacing'));
  heightItem.appendChild(el('div', {class:'si-text'}, [
    el('div', {class:'si-title'}, t('settings_item_height')),
    el('div', {class:'si-sub'}, `${s.itemHeight}px · ${t('settings_item_height_sub')}`)
  ]));
  heightGroup.appendChild(heightItem);
  const sliderWrap = el('div', {class:'slider-wrap'});
  const slider = el('div', {class:'slider'});
  const range = el('input', {type:'range', min:ITEM_HEIGHT_MIN, max:ITEM_HEIGHT_MAX, value:s.itemHeight});
  // 初始化 active track 百分比
  const updateSliderPct = ()=>{
    const pct = ((s.itemHeight - ITEM_HEIGHT_MIN)/(ITEM_HEIGHT_MAX - ITEM_HEIGHT_MIN))*100;
    range.style.setProperty('--slider-pct', pct+'%');
  };
  updateSliderPct();
  range.addEventListener('input', e=>{
    s.itemHeight = parseInt(e.target.value);
    Store.save();
    updateSliderPct();
    // 实时更新显示
    heightItem.querySelector('.si-sub').textContent = `${s.itemHeight}px · ${t('settings_item_height_sub')}`;
    $('#sliderValue').textContent = s.itemHeight+'px';
    renderHome();
  });
  slider.appendChild(range);
  sliderWrap.appendChild(slider);
  sliderWrap.appendChild(el('div', {class:'slider-value', id:'sliderValue'}, s.itemHeight+'px'));
  heightGroup.appendChild(sliderWrap);
  // 仅首条
  const firstOnlyItem = el('div', {class:'settings-item'});
  firstOnlyItem.appendChild(el('span', {class:'icon si-icon'}, 'looks_one'));
  firstOnlyItem.appendChild(el('div', {class:'si-text'}, [
    el('div', {class:'si-title'}, t('settings_first_only')),
    el('div', {class:'si-sub'}, t('settings_first_only_sub'))
  ]));
  const foSwitch = el('div', {class:'switch'+(s.firstOnly?' on':''), onclick:()=>{
    s.firstOnly = !s.firstOnly; Store.save(); renderSettings(); renderHome();
  }});
  foSwitch.appendChild(el('div', {class:'switch-thumb'}));
  firstOnlyItem.appendChild(foSwitch);
  heightGroup.appendChild(firstOnlyItem);
  content.appendChild(heightGroup);

  // 语言
  content.appendChild(el('div', {class:'section-title'}, t('settings_language')));
  const langGroup = el('div', {class:'settings-group'});
  const langItem = el('div', {class:'settings-item'});
  langItem.appendChild(el('span', {class:'icon si-icon'}, 'language'));
  const sel = LANGUAGES.find(l=>l.code===s.language) || LANGUAGES[0];
  // auto 模式下显示本地化的"跟随系统"，而非混合文本
  const displayLang = s.language==='auto' ? t('follow_system') : sel.nativeName;
  langItem.appendChild(el('div', {class:'si-text'}, [
    el('div', {class:'si-title'}, t('settings_language')),
    el('div', {class:'si-sub'}, displayLang)
  ]));
  langItem.appendChild(el('span', {class:'icon si-icon'}, 'chevron_right'));
  langItem.style.cursor='pointer';
  langItem.addEventListener('click', ()=>openLanguageMenu());
  langGroup.appendChild(langItem);
  content.appendChild(langGroup);

  // 关于
  content.appendChild(el('div', {class:'section-title'}, t('settings_about')));
  // 应用图标与名称
  const about = el('div', {class:'about-section'});
  const iconWrap = el('div', {class:'about-icon'});
  const img = el('img', {src:EMBEDDED_ICON_PNG, alt:'icon'});

  about.appendChild(iconWrap);
  about.appendChild(el('div', {class:'about-name'}, t('app_name')));
  about.appendChild(el('div', {class:'about-version'}, APP_VERSION));
  // Create with ❤️ by Crazy Sue
  const credit = el('div', {class:'about-credit'});
  credit.appendChild(document.createTextNode(t('created_by')));
  const link = el('a', {href:'#'}, 'Crazy Sue');
  link.addEventListener('click', e=>{
    e.preventDefault();
    window.open(APP_AUTHOR_URL, '_blank', 'noopener');
  });
  credit.appendChild(link);
  about.appendChild(credit);
  about.appendChild(el('div', {class:'about-glm'}, t('made_by')));

  // MIT 许可下拉
  const mitDd = el('div', {class:'dropdown', id:'mitDropdown'});
  const mitHeader = el('div', {class:'dropdown-header clickable', onclick:()=>{
    const willOpen = !mitDd.classList.contains('open');
    const body = mitDd.querySelector('.dropdown-body');
    if(willOpen){
      // 先展开：设为内容高度以触发过渡
      mitDd.classList.add('open');
      body.style.maxHeight = body.scrollHeight + 'px';
    }else{
      // 收起：先设回当前高度（覆盖 none），再强制重排，再设 0 触发过渡
      body.style.maxHeight = body.scrollHeight + 'px';
      void body.offsetHeight;
      body.style.maxHeight = '0px';
      mitDd.classList.remove('open');
    }
  }});
  mitHeader.appendChild(el('span', {class:'icon dh-icon'}, 'description'));
  mitHeader.appendChild(el('span', {class:'dh-title'}, t('mit_license_title')));
  mitHeader.appendChild(el('span', {class:'icon dh-arrow'}, 'expand_more'));
  mitDd.appendChild(mitHeader);
  const mitBody = el('div', {class:'dropdown-body'});
  mitBody.appendChild(el('div', {class:'dropdown-body-inner'}, el('div', {class:'license-text'}, MIT_LICENSE_TEXT)));
  mitDd.appendChild(mitBody);
  content.appendChild(mitDd);

  // OSS 许可下拉
  const ossDd = el('div', {class:'dropdown', id:'ossDropdown'});
  const ossHeader = el('div', {class:'dropdown-header clickable', onclick:()=>{
    const willOpen = !ossDd.classList.contains('open');
    const body = ossDd.querySelector('.dropdown-body');
    if(willOpen){
      ossDd.classList.add('open');
      body.style.maxHeight = body.scrollHeight + 'px';
    }else{
      body.style.maxHeight = body.scrollHeight + 'px';
      void body.offsetHeight;
      body.style.maxHeight = '0px';
      ossDd.classList.remove('open');
    }
  }});
  ossHeader.appendChild(el('span', {class:'icon dh-icon'}, 'gavel'));
  ossHeader.appendChild(el('span', {class:'dh-title'}, t('oss_license_title')));
  ossHeader.appendChild(el('span', {class:'icon dh-arrow'}, 'expand_more'));
  ossDd.appendChild(ossHeader);
  const ossBody = el('div', {class:'dropdown-body'});
  const ossInner = el('div', {class:'dropdown-body-inner'});

    const item = el('div', {class:'license-item'});
    item.appendChild(el('div', {class:'li-name'}, l.name));
    item.appendChild(el('div', {class:'li-license'}, l.license));
    item.appendChild(el('div', {class:'license-text'}, l.text));
    ossInner.appendChild(item);
  });
  ossBody.appendChild(ossInner);
  ossDd.appendChild(ossBody);
  content.appendChild(ossDd);
}

/* 语言选择菜单（用对话框） */
function openLanguageMenu(){
  const title = $('#langModalTitle');
  const body = $('#langModalBody');
  title.textContent = t('settings_language');
  body.innerHTML='';
  const list = el('div', {style:'display:flex;flex-direction:column;gap:4px;'});
  LANGUAGES.forEach(l=>{
    const sel = Store.state.settings.language===l.code;
    const displayName = l.code==='auto' ? t('follow_system') : l.nativeName;
    const item = el('div', {class:'lang-item'+(sel?' selected':''), onclick:()=>{
      Store.state.settings.language = l.code;
      Store.save();
      closeLangModal();
      updateStaticLabels();
      renderSettings();
      renderTopbar('settings');
      renderBottombar();
      renderHome();
    }});
    item.appendChild(el('span', {class:'icon si-icon', style:sel?'color:var(--md-primary)':''}, sel?'check':'language'));
    item.appendChild(el('div', {class:'si-text'}, el('div', {class:'si-title'}, displayName)));
    list.appendChild(item);
  });
  body.appendChild(list);
  $('#langModalCancel').textContent = t('cancel');
  openLangModal();
}
function openLangModal(){
  $('#langScrim').classList.add('visible');
  $('#langModal').classList.add('visible');
}
function closeLangModal(){
  $('#langScrim').classList.remove('visible');
  $('#langModal').classList.remove('visible');
}

/* ---------- 图标选择弹窗 ---------- */
let iconPickerContext = null; // {type:'checklist'|'item', itemId?}
function openIconPicker(type, itemId){
  iconPickerContext = {type, itemId};
  $('#iconPickerTitle').textContent = t('select_icon');
  $('#iconPickerSearch').value='';
  renderIconPickerGrid('');
  $('#iconPickerScrim').classList.add('visible');
  $('#iconPickerModal').classList.add('visible');
}
function closeIconPicker(){
  $('#iconPickerScrim').classList.remove('visible');
  $('#iconPickerModal').classList.remove('visible');
}
function renderIconPickerGrid(filter){
  const grid = $('#iconPickerGrid');
  grid.innerHTML='';
  const lower = filter.toLowerCase();
  const icons = ICON_LIBRARY.filter(ic=> !lower || ic.includes(lower));
  if(icons.length===0){
    grid.appendChild(el('div', {style:'grid-column:1/-1;text-align:center;padding:24px;color:var(--md-on-surface-variant)'}, t('no_results')));
    return;
  }
  icons.forEach(ic=>{
    const opt = el('button', {class:'icon-option', onclick:()=>selectIcon(ic)});
    opt.appendChild(el('span', {class:'icon'}, ic));
    grid.appendChild(opt);
  });
}
function selectIcon(iconName){
  const ctx = iconPickerContext;
  if(!ctx) return;
  if(ctx.type==='checklist'){
    formState.icon = iconName;
    renderForm();
  }else if(ctx.type==='item'){
    const item = formState.items.find(i=>i.id===ctx.itemId);
    if(item){ item.icon = iconName; renderForm(); }
  }
  closeIconPicker();
}

/* ---------- 搜索 ---------- */
let searchActive = false;
function toggleSearch(){
  if(searchActive){
    closeSearch();
  }else{
    openSearch();
  }
}
function openSearch(){
  searchActive = true;
  $('#btnSearch').classList.add('is-active');
  $('#searchBar').classList.add('visible');
  setTimeout(()=>$('#searchInput').focus(), 250);
}
function closeSearch(silent){
  if(!searchActive && silent) return;
  searchActive = false;
  $('#btnSearch').classList.remove('is-active');
  $('#searchBar').classList.remove('visible');
  $('#searchInput').value='';
  $('#searchBar').classList.remove('has-text');
  // 清除高亮
  $$('.check-item.is-search-match').forEach(n=>n.classList.remove('is-search-match'));
}
function doSearch(q){
  q = q.trim().toLowerCase();
  $('#searchBar').classList.toggle('has-text', q.length>0);
  const cl = getActiveChecklist();
  if(!cl) return;
  // 清除旧高亮
  $$('.check-item.is-search-match').forEach(n=>n.classList.remove('is-search-match'));
  if(!q){
    return;
  }
  // 找第一个匹配的待办项
  const match = cl.items.find(i=>!i.done && i.text.toLowerCase().includes(q));
  if(match){
    const node = $(`.check-item[data-id="${match.id}"]`);
    if(node){
      node.classList.add('is-search-match');
      node.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }
}

/* ---------- 页面切换 ---------- */
let currentPage = 'home'; // home | form | settings
function switchPage(target){
  const pages = {home:'#pageHome', form:'#pageForm', settings:'#pageSettings'};
  const curEl = $(pages[currentPage]);
  const tgtEl = $(pages[target]);
  if(curEl===tgtEl) return;
  // 判断方向：home在左，form/settings在右
  const order = ['home','form','settings'];
  const curIdx = order.indexOf(currentPage);
  const tgtIdx = order.indexOf(target);
  const goRight = tgtIdx > curIdx;

  curEl.classList.remove('page-active');
  curEl.classList.add(goRight? 'page-leave-left':'page-leave-right');
  tgtEl.classList.remove('page-enter-right','page-enter-left','page-leave-left','page-leave-right');
  // 先设置初始位置
  tgtEl.classList.add(goRight? 'page-enter-right':'page-enter-left');
  requestAnimationFrame(()=>{
    tgtEl.classList.remove('page-enter-right','page-enter-left');
    tgtEl.classList.add('page-active');
  });

  currentPage = target;
}

/* ---------- 对话框 ---------- */
function openDialog(){
  $('#dialogScrim').classList.add('visible');
  $('#confirmDialog').classList.add('visible');
}
function closeDialog(){
  $('#dialogScrim').classList.remove('visible');
  $('#confirmDialog').classList.remove('visible');
}

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg){
  const toast = $('#toast');
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('visible'), 2200);
}

/* ---------- 事件绑定 ---------- */
function bindEvents(){
  // 顶栏按钮 —— 附加水滴效果
  ['btnConfig','btnSearch','btnSettings','sbBack','sbClear'].forEach(id=>{
    const el = $('#'+id);
    if(el) attachRipple(el);
  });
  // 顶栏按钮
  $('#btnConfig').addEventListener('click', ()=>{
    const cl = getActiveChecklist();
    if(cl) openForm(cl.id);
  });
  $('#btnSearch').addEventListener('click', toggleSearch);
  $('#btnSettings').addEventListener('click', ()=>{
    if(currentPage==='settings' || currentPage==='form'){
      // 从设置页或表单页返回主页
      Store.state._editing = null;
      switchPage('home');
      renderTopbar('home');
      renderHome();
    }else{
      renderSettings();
      switchPage('settings');
      renderTopbar('settings');
    }
  });

  // 搜索
  $('#sbBack').addEventListener('click', ()=>closeSearch());
  $('#sbClear').addEventListener('click', ()=>{
    $('#searchInput').value='';
    $('#searchBar').classList.remove('has-text');
    doSearch('');
    $('#searchInput').focus();
  });
  $('#searchInput').addEventListener('input', e=>doSearch(e.target.value));

  // 重置 FAB
  const resetFab = $('#btnResetList');
  attachRipple(resetFab);
  resetFab.addEventListener('click', ()=>{
    const cl = getActiveChecklist();
    if(cl) resetChecklist(cl.id);
  });

  // 图标选择弹窗
  $('#iconPickerScrim').addEventListener('click', closeIconPicker);
  $('#iconPickerCancel').addEventListener('click', closeIconPicker);
  // 语言弹窗
  $('#langScrim').addEventListener('click', closeLangModal);
  $('#langModalCancel').addEventListener('click', closeLangModal);
  $('#iconPickerSearch').addEventListener('input', e=>renderIconPickerGrid(e.target.value));

  // 对话框
  $('#dialogScrim').addEventListener('click', closeDialog);

  // 系统主题变化
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
      if(Store.state.settings.theme==='auto') applyTheme();
    });
  }

  // 键盘 ESC
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if($('#iconPickerModal').classList.contains('visible')) closeIconPicker();
      else if($('#confirmDialog').classList.contains('visible')) closeDialog();
      else if(searchActive) closeSearch();
      else if(currentPage!=='home'){
        switchPage('home');
        renderTopbar('home');
      }
    }
  });

  // 防止双击缩放
  let lastTouch=0;
  document.addEventListener('touchend', e=>{
    const now=Date.now();
    if(now-lastTouch<300){ e.preventDefault(); }
    lastTouch=now;
  }, {passive:false});
}

/* ---------- 更新静态元素的国际化标签 ---------- */
function updateStaticLabels(){
  // 搜索栏按钮
  $('#sbBack').setAttribute('aria-label', t('search'));
  $('#sbClear').setAttribute('aria-label', t('cancel'));
  $('#searchInput').setAttribute('placeholder', t('search_placeholder'));
  // 图标选择弹窗
  $('#iconPickerTitle').textContent = t('select_icon');
  $('#iconPickerSearch').setAttribute('placeholder', t('icon_search'));
  $('#iconPickerCancel').textContent = t('cancel');
  // 文档语言
  document.documentElement.lang = getLang();
  document.title = t('app_name');
}

/* ---------- 初始化 ---------- */
function init(){
  Store.load();
  applyTheme();
  bindEvents();
  initGlobalRipple();

  // 如果没有检查单，设置为空状态
  if(Store.state.checklists.length===0){
    Store.state.activeChecklistId = null;
  }else if(!Store.state.activeChecklistId || !Store.state.checklists.find(c=>c.id===Store.state.activeChecklistId)){
    Store.state.activeChecklistId = Store.state.checklists[0].id;
  }

  updateStaticLabels();
  renderTopbar('home');
  renderHome();
  renderBottombar();
  // 启动时检查自动重置
  checkAutoReset();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
